<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 &mdash; Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --teal:#14b8a6;--teal-2:#0ea5e9;--grad:linear-gradient(135deg,#14b8a6,#0ea5e9);
    --bg:#071a22;--text:#e9f5f8;--muted:#8fa9b3;--line:rgba(255,255,255,.12);
  }
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(70% 55% at 50% 0%,rgba(20,184,166,.28),transparent 70%);
  }
  .box{position:relative;z-index:1;max-width:520px}
  .mark{width:74px;height:74px;margin:0 auto 26px;border-radius:22px;background:var(--grad);display:grid;place-items:center}
  .mark svg{width:40px;height:40px;color:#03161c}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(3rem,10vw,5.5rem);margin:0 0 8px;line-height:1}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--muted);margin:0 0 30px;font-size:1.05rem}
  a.btn{
    display:inline-flex;align-items:center;gap:.6em;padding:15px 32px;border-radius:999px;
    background:var(--grad);color:#03161c;text-decoration:none;font-weight:800;
    box-shadow:0 18px 40px -18px rgba(20,184,166,1);transition:transform .25s;
  }
  a.btn:hover{transform:translateY(-3px)}
  a.home{display:block;margin-top:18px;color:var(--muted);font-size:.9rem;text-decoration:none}
  a.home:hover{color:var(--teal)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3l3.6 7.7 8.4 1-6.2 5.8 1.6 8.3L16 21.8 8.6 25.8l1.6-8.3L4 11.7l8.4-1L16 3z" fill="currentColor"/></svg>
    </div>
    <h1><span>404</span></h1>
    <p>This page has wandered off. Let&rsquo;s get you back to the hotel.</p>
    <a class="btn" href="/">Back to the homepage</a>
    <a class="home" href="/#rooms">or jump straight to the rooms &rarr;</a>
  </div>
</body>
</html>
